name: Post to Instagram

on:
  schedule:
    # Hourly, all day, in UTC. The pipeline itself (src/pipeline/publish.ts) converts
    # to TIMEZONE and only generates/renders/posts when a slot (7:00 / 20:30 local) is
    # due, still inside its CATCHUP_MINUTES window, and not already posted. Every other
    # run is a fast no-op. Running on the hour in UTC survives daylight saving
    # automatically, since the local-time check is what decides whether to act.
    #
    # Minute 17 rather than 0 on purpose: GitHub's shared cron queue is most congested
    # at the top of the hour, and scheduled runs there are the most likely to be delayed
    # or dropped. Paired with the 3-hour catch-up window in publish.ts, an hourly cron
    # gives each slot ~3 attempts, which is why this no longer needs to fire every
    # 15 minutes (96 no-op runs/day -> 24).
    - cron: "17 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run publish pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: npm run publish

      - name: Commit updated state
        run: |
          git config user.name "aimotivationauto-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/last-post.json
          git diff --cached --quiet || git commit -m "chore: update publish state [skip ci]"
          git push
